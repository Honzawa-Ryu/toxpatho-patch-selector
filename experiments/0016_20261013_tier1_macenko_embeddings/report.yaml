title: 反復投与全ControlとtierI投与群のMacenko正規化埋め込み
status: 部分実行(主要phaseは完了、sub_group段が未実行で継続中)
purpose: 染色正規化を必須とする方針に合わせ、反復投与の全Controlと投与群のMacenko正規化UNI2-h特徴量を抽出する。
method: 追加Control 1,979枚の座標をTRIDENTで作成し、全Controlから推定した参照染色(reference.json)でMacenko正規化してUNI2-h抽出。Controlは1枚2,048patchのサブサンプル、塊内の投与群やBayer注釈slideなどは全patchをphase(chunk 0〜3)ごとに追加抽出。
