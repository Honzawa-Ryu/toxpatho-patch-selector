# ============================================================
# 0016: 反復投与Liverの全Control（143実験）と tier1投与群を Macenko正規化して埋め込み直す
# ============================================================
# 染色正規化は基本必須（2026-10-13ユーザー方針）。0005の手順（lib/stain.py、UNI2-h、
# TRIDENTと同じ推論経路）を広げる。系列C（全反復投与Controlの大規模調査）を先に始められるよう、
# phaseを分けて Control を先に処理する。
#   coords  : 追加取得したControl（座標なし）にTRIDENTでseg+coordsだけ実行
#   ctrl    : 全ControlをMacenko正規化して抽出
#   treated : tier1コーパスの投与群をMacenko正規化して抽出
# ============================================================

seed: 42

# --- 入力 ---
tier1_manifest: "outputs/0009_20260919_tier1_corpus_clustering/manifest_tier1_corpus.parquet"   # 3,441枚（44化合物）
tier1_coords_dir: "outputs/0009_20260919_tier1_corpus_clustering/features_tier1_corpus"          # 既存TRIDENT出力のsymlink
added_ctrl_list: "outputs/target_slide_list/ctrl_repeat_missing.csv"
added_treated_list: "outputs/target_slide_list/block_largest_cut072_missing.csv"   # 2026-10-17転送: 最大の塊の31試験の投与群1,828枚                           # 追加Control 1,979枚（99化合物）
added_annot_list: "outputs/target_slide_list/bayer_annotated_all_missing.csv"   # 2026-10-26: Bayerアノテーションの230枚のうち全patchの特徴量がない169枚（10-24の71枚＋HDDから持ってきた98枚）。svs_path列あり。抽出済みはskip
wsi_dir: "data/TGGATEs/WSI/Liver"

# --- 参照染色 ---
# 全Control（143実験）の平均的な染色。各実験のControlから一様にslideを抽出する（2026-10-13ユーザー方針）。
# seed固定で、どのphase・chunkでも同じ参照になる。最初に計算したものを outputs/<exp>/reference.json に保存し、以後はそれを読む。
reference_slides_per_exp: 2
reference_patches_per_slide: 20

# --- 出力（0001と同じレイアウト）---
features_subdir: "20x_256px_0px_overlap/features_uni_v2_macenko"          # treated: 全patch
# ctrl phaseは系列Cの調査を早く回すため、1枚あたり無作為2,048 patchだけ抽出する（2026-10-14、方法はユーザー一任）。
# 全patchが必要になったら、同じslideをfeatures_subdirに全patchで抽出し直す。
ctrl_patches_per_slide: 2048
ctrl_features_subdir: "20x_256px_0px_overlap/features_uni_v2_macenko_sub2048"

# --- TRIDENT（coords phase、0008と同一設定）---
segmenter: "hest"
reader_type: "openslide"
mag: 20.0
patch_size: 256
overlap: 0

# --- 染色推定・エンコーダ（0005と同一）---
fit_patches_per_slide: 40
patch_encoder: "uni_v2"
batch_size: 64
num_workers: 7

n_chunks: 4                     # run_slurm.shの--array=0-3と一致させる

# full phase（2026-10-16）: 系列Cの最大の塊（cut 0.72、44試験）のうち手元に投与群がある13試験の全slide（Control含む、1,020枚）を
# 全patchで抽出する。patch分類につなげるため全patch（ユーザー判断）。出力はfeatures_subdir（treatedと同じ）。
full_exp_ids: [182, 184, 305, 368, 413, 434, 538, 569, 571, 573, 594, 596, 686]
# full_block3 phase（2026-10-17）: cut 0.72の塊3（23試験）のうち手元に投与群がある11試験の全slide（853枚）を全patchで抽出（0017の塊3テスト用）
full_exp_ids_block3: [174, 176, 280, 282, 319, 346, 348, 391, 428, 432, 463]

# ローカルSSD（/scratch、NVMe）にsvsをコピーしてから読む（2026-10-18、ユーザー希望「早くなるならそっち」）。
# coords段はバッチごと、抽出段は1枚ずつ先読みし、使い終わったら消す。外すと従来どおり/workspaceを直接読む。
staging_root: "/scratch/honzawa/stage_0016"
staging_batch_size: 30
