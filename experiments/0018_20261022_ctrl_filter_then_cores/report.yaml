title: Control近さで選別してからコアを作る2段階方式
status: 完了
purpose: 全体クラスタリングを正常patch除去に使い、残したpatchだけでコアを作り直して所見との対応を改善できるか調べる。
method: '1段目: 0017の60 runでpatchが入ったクラスタのControl割合を平均したスコアで閾値以下を残す(既定はYouden型の差最大)。2段目: 残したpatchでk=10/20/40×20 runのkごとコンセンサス(τ=0.8, Leiden)を作り、通過率と重症度、所見→コアAUC、ピントとの関係を解析。'
results:
- 'block6_clean(閾値0.254)の残存率: 全体32.0% / Control 14.6% / 投与所見なし25.0% / 所見あり64.2%、k=20でコア27・最多化合物割合0.22・一致度0.93(README.md, block6_clean/stage2_summary.csv)'
- 閾値0.07では残存8.3%(Control 0.2%、所見あり30.1%)、コア19・最多化合物割合0.67と1化合物に寄る(README.md)
- '最大重症度ごとの通過率中央値(閾値0.07): Control 0.00、所見なし0.00、minimal 0.02、slight 0.13、moderate 0.54、severe 0.85(README.md, pass_vs_pathology/P1_pass_rate_by_grade.png)'
- 組み合わせ版(1段目0.07+2段目centered)はControlをほぼ含まず化合物をまたぐコア23個(最多化合物割合0.35)を得たが一致度は0.72に低下(README.md)
- 同試験内の陽性/陰性slideを分けるAUCは主要7所見中5所見で1段目通過率が最良コアより高く、コアは『異常の量×化合物』に近い(finding_to_core/, README.md)
- Control 52759の縦縞はスキャナのストライプ(2,032px)と同間隔だが、patchスコアとピントの順位相関は0.09(block6_clean/focus_maps/patch_vs_focus_summary.csv, README.md)
