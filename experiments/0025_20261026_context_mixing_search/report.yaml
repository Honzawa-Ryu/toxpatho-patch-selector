title: 隣接patch情報の入れ方の探索
status: 完了
purpose: 隣接patchの情報を表現に入れる最良の方法・係数を、リークのない設定選択で探す。
method: Bayer 230枚の全patch(約325万)で、LDAを試験ごと5分割のout-of-foldで作り、試験をselect/testに分けて設定選択。v1線形・差分・平滑化等63設定、v2境界保存(bilateral)等、v3学習型GCN、v4コンセンサスk-meansとseed安定性、v5 k掃引、v6旧文脈表のリークなし再測定。
results:
- 'v1-v3の最良は境界保存伝播(hops2,w1.0,α0.5,σq0.1): test NMI 0.391 vs self0.376、隣接同一率0.38 vs 0.28、小構造純度0.350 vs 0.362（search_v3/search.csv）'
- 'v4: コンセンサス10回でseed間ARI self_k30 0.46→0.60、bilateral 0.59→0.63（search_v4/search_runs.csv）'
- 'v5: NMIはk≈20〜40で最大(bilateral k30 0.389、self k30 0.371)、小構造純度はk増で上昇(self k200 0.468)（search_v5/search.csv, K1_k_sweep.png）'
- 'v6: 旧表のlinear hops4 w2.0は隣接同一率0.51・test NMI0.386、ctx_onlyは0.66/0.350（search_v6/search.csv）'
