title: patchプロトタイプ試作と隣接・小葉情報
status: 完了
purpose: slide内順位・Bayerラベル由来LDAを使ったk-meansプロトタイプが試験をまたいで所見・構造を分けるか試作する。
method: unsup(順位→PCA64)/weak(順位→LDA)/combo(LDA+残差PCA16)でk=30のk-meansを作成(v1:61枚, v2_132:132枚)。全patch地図(v3_maps)、8近傍伝播による隣接情報(context_v1, context_build_v*, explore_v*)、小葉位置のリッジ回帰(lobular_probe_v1-3)も試した。
results:
- 'v1(約16万patch): NMI unsup0.28/weak0.48、クラスタあたり試験数中央値41.5/42（README.md）'
- 'v2_132(約23万patch・66試験): NMI unsup0.37/weak0.51/combo0.49、comboで核分裂像52%が1クラスタ(純度84%,61試験)、大血管純度99%（README.md, v2_132/results.json）'
- comboの壊死クラスタは純度99%だがallyl alcoholが85%で化合物と交絡（README.md, P1_labels_and_clusters_combo.png）
- 隣接伝播で隣のまとまり25%→73%、ラベル一致0.49→0.36。小葉位置はプロトタイプとのNMI0.025だが回帰でslide外CV R²0.18〜0.28（README.md, context_v1/context_metrics.csv, lobular_probe_v3/lobular_probe.csv）
