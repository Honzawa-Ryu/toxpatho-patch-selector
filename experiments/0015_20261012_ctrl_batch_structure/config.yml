# 0015: 無所見Ctrlをまとめてクラスタリングし、試験間差・scanner差を見る（plan.md）
embedding_cache_dir: "outputs/0009_20260919_tier1_corpus_clustering/embedding_cache"   # PCA64、全3,441枚で学習
feature_dir: "outputs/0009_20260919_tier1_corpus_clustering/features_tier1_corpus"     # patch_size_level0の取得用
eval_manifest_parquet: "experiments/0010_20260925_pathology_benchmark_subset/label_audit/manifest_known_unique.parquet"
scanner_csv: "experiments/0010_20260925_pathology_benchmark_subset/label_audit/slide_scanner_meta.csv"

patches_per_slide: 512        # 学習patch（1枚あたり）
ks: [50, 100]
sample_seeds: [0, 1, 2, 3, 4] # 学習patch抽出のseed
init_seeds: [0, 1, 2, 3]      # k-means++初期化のseed
n_perm: 1000                  # 並べ替え検定の回数

outlier_top: 5                # runごとに「外れ試験」とみなす上位数
bias_share: 0.5               # 上位1試験の占有シェアがこれ以上のクラスタを「試験に偏る」とみなす

# 画像シート（各kの代表run = sample_seed 0 / init_seed 0 のみ）
sheet_rows: 20                # 偏りの強い順に並べるクラスタ数
sheet_cols: 6
max_per_slide: 1
sheet_seed: 0

# 特徴量の入力（--variantで選ぶ）。mainは2026-10-13の初回run（染色正規化なし・全3,441枚で学習したPCA）。
# s219_*は0005の219枚に含まれる無所見Ctrlに限り、正規化の有無だけを変えて比べる（PCAは両者とも対象slideで学習）。
variants:
  main:
    source: cache
  s219_raw:
    source: h5
    features_dir: "outputs/0001_20260907_extract_wsi_embeddings/trident_job/20x_256px_0px_overlap/features_uni_v2"
    restrict_to_dir: "outputs/0005_20260913_stain_normalized_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko"
    pca_components: 64
    pca_patches_per_slide: 512
    pca_seed: 0
  s219_macenko:
    source: h5
    features_dir: "outputs/0005_20260913_stain_normalized_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko"
    restrict_to_dir: "outputs/0005_20260913_stain_normalized_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko"
    pca_components: 64
    pca_patches_per_slide: 512
    pca_seed: 0
  # 系列C本番（Issue #2）: 反復投与の全Control（144試験）。0016 ctrl段の正規化済み特徴量（各2,048 patch）
  allctrl_macenko:
    source: h5
    manifest_parquet: "experiments/0015_20261012_ctrl_batch_structure/ctrl_survey_manifest.parquet"   # scripts/build_ctrl_survey_manifest.py
    features_dir: "outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko_sub2048"
    restrict_to_dir: "outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko_sub2048"
    include_ctrl_with_findings: false   # 未決（Issue #2）。まず無所見のみ
    pca_components: 64
    pca_patches_per_slide: 512
    pca_seed: 0
    n_perm: 200                         # slide対が約400万あるため回数を減らす（最小p=0.005）
