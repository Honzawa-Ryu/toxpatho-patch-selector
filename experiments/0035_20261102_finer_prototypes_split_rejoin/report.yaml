title: 細かいプロトタイプの分割・再結合と試験間差の検証
status: 完了(v1・v2+追加解析6種。目視は一部のみ)
purpose: プロトタイプを細かくして純度を上げる方法を比べ、さらにラベルなし所見の抽出と試験間差(対照群の識別)を調べる。
method: 'Bayer+脂肪変性3試験+未学習3,319枚(1,043万patch)でA/A128に13方法(flat k100〜1000、split_label/record/dispersion、Ward再結合)を適用(v1)、v2はLDAなし(B128/B/D)。追加解析: unlabeled_findings、control_study_identification、within_study_findings、control_similarity、group_crossstudy、group_reference。'
results:
- 'v1(A): k=100→1000でheld-out coverageは0.17→0.18と不変、split_labelのみ0.23。脂肪変性の化合物内coverageは0→0.47/0.37(k=1000)(README.md, v1/summary.csv)'
- 'v2(LDAなし): B128 flat_k1000の脂肪変性coverage CCl4 0.48/chol 0.40でLDAありと同程度、held-out F1はB128 k100 0.31(v2/fatty_within_compound.csv, v2/heldout_summary.csv)'
- 'unlabeled_findings: 肥大で選んだ250プロトタイプは肥大slide 21%/対照1.3%、化合物held-out AUC 0.95(A128)だが所見間Jaccard 0.22〜0.72で投与全般を拾う(unlabeled_findings/overview.csv, README.md)'
- 'control_study_identification: 対照群だけで試験を識別できる(AUC中央値 A128 0.86、C 0.88、D 0.93)。LDAで試験間差はつぶれない(README.md)'
- 'within_study_findings: 試験内AUC 肥大0.83・空胞化0.90・胆管増生0.88・好酸性変化0.79、所見間Jaccard 0.00〜0.28に低下(within_study_findings/summary.csv)'
- 'control_similarity: 143試験の対照群ペア識別AUC中央値0.995、偶然と区別できない組5.5%、36まとまりの多くが単一スキャナ・単一0015塊(control_similarity/, README.md)'
- 'group_reference: 投与全般を除かない場合、A128肥大でまとまり内の対照を使う方が17組中15組で高AUC(p=0.002)、除くと差は消える(group_reference/, README.md)'
