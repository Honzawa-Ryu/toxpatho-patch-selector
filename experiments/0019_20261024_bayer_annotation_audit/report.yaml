title: Bayer病変アノテーションの監査
status: 完了
purpose: Bayer AG/Aignosticsによる TG-GATEsラット肝230枚の病変アノテーションの中身・座標・信用性を確認する。
method: ポリゴンを集計し、手元svsのある132枚で重ね描き・ラベル別ギャラリーを作成、TG-GATEs所見記録と突き合わせた(単一variant default)。
results:
- 230枚・57化合物・ポリゴン18,171個、うち手元svs 132枚、block6_cleanと重なるのは42枚（README.md）
- ポリゴン面積の組織上割合は中央値97%で座標は一致、実質ラベルの組織被覆は中央値0.2%（最大6%）で網羅的でない（README.md, C3_coverage_and_alignment.png）
- '記録あり/なしslideで描かれた割合: 壊死97%/34%、核分裂増加→核分裂像100%/56%、単細胞壊死95%/70%、細胞浸潤78%/51%、胆管増生24%/0.5%（README.md, annotation_vs_record.csv）'
- アノテーションの9割（15,660件）はpathologist-0の1人（README.md）
