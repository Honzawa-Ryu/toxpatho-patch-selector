# 0026: 脂肪変性（微小滴と大滴）がプロトタイプとして分かれるか（2026-10-26ユーザー: 微小滴と大滴をプロトタイプとして分けられることに価値がある。
# 1つの所見が1クラスタより、1クラスタの純度が高い方が価値が高い）。
# 表現は0025の土台（slide内の順位 → 0021の教師なしPCA256 → combo）と、0025で最良だった境界を保つ伝播。
# LDA・残りのPCAは、Bayerのポリゴンがある230枚（0025 cache_v1）で学ぶ。Bayerには脂肪のラベルがないので、脂肪の区別は教えていない。
seed: 0
exp0020: 0020_20261024_batch_robust_methods
exp0021: 0021_20261025_patch_prototypes
exp0025: 0025_20261026_context_mixing_search
cache_from: cache_v1
combo_resid_dim: 16
combo_resid_weight: 0.5
qc_catalog: /workspace/andre01/honzawa/02-playground/tggate-wsi-qc/outputs/qc/catalog/slide_quality.csv
pathology_csv: data/corrected/open_tggates_pathology.csv
features_dir: outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko
target_exps: [66, 67, 698]     # CCl4 単回・反復（中心静脈側の脂肪変性）、cholesterol食（辺縁の脂肪変性）
fat_findings: ["Degeneration, fatty", "Vacuolization, cytoplasmic", "Deposit, lipid", "Degeneration, vacuolar"]
grade_map: {minimal: 1, slight: 2, moderate: 3, severe: 4, P: 1}
workers: 6

context: {hops: 2, w: 1.0, alpha: 0.5, sigma_q: 0.1}   # 0025の最良（境界を保つ伝播）
ks_big: [100, 200]               # 2026-10-27ユーザー: 細かく作ってから階層でまとめる（NMIに合わせてkを決めると、Bayerにない所見が押し込まれる）
cuts: [20, 30, 40, 60]           # 階層をこの数で切ったものも評価する
representations: [raw, unsup, unsup_lda0.5, unsup_lda1, unsup_lda2, combo, combo_bilateral, combo_strong]   # 2026-10-27ユーザー: LDAでつぶさず元の表現も残る塩梅を探す。unsup_ldaβ = unsup（PCA64）＋β×LDA
sheet_at: [[100, 100], [200, 200]]   # 画像シートを作る（k-meansのk, 切った数）
map_reps: [raw, unsup_lda1, combo_bilateral]
min_proto_patches: 500           # 要約で、化合物のpatchがこれ未満のプロトタイプは除く
consensus_runs: 10               # 0025 v4: コンセンサスk-meansでseed依存を減らす
map_at: [100, 100]
fit_annot: 400000              # k-meansの学習点: 230枚から
fit_target: 400000             # k-meansの学習点: 脂肪変性の試験から（脂肪のpatchがプロトタイプを作れるように）
min_ctrl: 2
top_prototypes: 6              # 化合物ごとに、試験内のControlより増えるプロトタイプの上位を画像にする
sheet_tiles: 24
map_thumb: 1400

# --variant tree_v1: 系統樹（2026-10-27ユーザー: unsup＋1×LDAが最適候補、細かく作って階層でまとめるアプローチを見たい）
lda_beta: 1.0
ctrl_features_dirs:
  - outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko
  - outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko_sub2048
variants:
  tree_v2:     # 2026-10-27: 0027で最良のSphering＋LDAで系統樹。Bayerの集合と重なる対象のslide（12枚）を除く
    representations: [sphering_lda, unsup_lda1]
    drop_annot_overlap: true
    ks_big: [100]
    cuts: [20, 30, 40]
    sheet_at: [[100, 100]]
    map_reps: [sphering_lda]
    map_at: [100, 100]
    tree: {k: 100, cuts: [20, 30, 40], color_cut: 30}
  tree_v1:
    representations: [unsup_lda1]
    ks_big: [100]
    cuts: [20, 30, 40]
    sheet_at: []
    map_at: [0, 0]
    tree: {k: 100, cuts: [20, 30, 40], color_cut: 30}
