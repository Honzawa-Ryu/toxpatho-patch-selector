title: 脂肪変性のプロトタイプ分離
status: 完了（README無し）
purpose: Bayerにラベルのない脂肪変性(微小滴・大滴)が高純度のプロトタイプとして分かれるかを調べる。
method: CCl4単回・反復とcholesterol食の試験を対象に、raw/unsup/unsup+β·LDA/combo系の表現でコンセンサスk-means(k=100/200)→Ward階層で20〜60に切って評価(v1)。tree_v1で系統樹、tree_v2でSphering+LDA(試験Control白色化)、tree_v3でBayerの脂肪・空胞化21枚をLDA学習から除外、tree_v3s/v3uでラベル有無×Sphering有無の2×2を比較。
results:
- 'v1: 対象200枚・約345万patch。raw k100でcholesterolの純度≥0.9プロトタイプ2個、CCl4最良Spearman0.88（v1/summary.csv）'
- 'tree_v3(188枚): sphering_lda k100でBayer NMI0.378・均質性0.602、純度≥0.9がCCl4で7個・cholesterolで6個（tree_v3/summary.csv）'
- 'tree_v3u: LDAのみはNMI0.417と高いがcholesterolの純度≥0.9は0個、unsupは5個。tree_v3s(Sphering)はNMI0.332・5個（tree_v3u/summary.csv, tree_v3s/summary.csv）'
- cholesterolではp45/p60の占有率がgrade sevで約0.2まで単調増加（F1_share_by_grade_sphering_lda_k100.png）
