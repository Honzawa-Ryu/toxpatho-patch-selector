# ============================================================
# Experiment Configuration — 0003 variant: 219 original + CCl4 100
# ============================================================
# 決定的な脂肪変性の対比実験（plan.md参照）: `Degeneration, fatty` が
# cholesterol+cholate（辺縁性, 元219枚に含まれる）と carbon tetrachloride
# （小葉中心性, 0007で新規抽出）で同じクラスタに落ちるか、別クラスタに
# 分かれるか。マニフェスト・特徴量は scripts/build_ccl4_comparison_manifest.py
# が作った319枚（219+100）の結合版を指す。
# ============================================================

seed: 42

# --- 入力 ---
variant_key: "cluster_mining_ccl4"
manifest_parquet: "outputs/0003_20260912_control_absent_cluster_mining/manifest_219_plus_ccl4.parquet"
features_dir: "outputs/0003_20260912_control_absent_cluster_mining/features_219_plus_ccl4"

# --- 前処理 ---
l2_normalize: true
pca_components: 64
pca_patches_per_group: 160000

# --- クラスタリング ---
k_values: [100, 500, 2000]
kmeans_fit_sample: 500000
kmeans_batch_size: 10000
kmeans_n_init: 3
kmeans_max_iter: 300

# --- control欠損クラスタの判定 ---
presence_eps: 0.001
q_threshold: 0.05
# plan.md 2026-09-16の決定: k=100はmin_compounds>=2を外す（同一表現型の別変種を
# 拾うため）。k>=500は外すと候補が爆発しLOCOも落ちるので維持。
min_compounds:
  "100": 1
  "500": 2
  "2000": 2
# plan.md 2026-09-17の決定: min_treated_presenceもkごとに変える。9化合物・139枚の
# 投与群プールでは「全体の10%」という絶対枚数がcholesterol等の本物の信号を
# 機械的に落としていた（config_ccl4_no_presence_filter.ymlでの検証）。
# k=100/500は外す方がLOCOも上がる（0.560→0.836 / 0.507→0.563）。
# k=2000は逆に必要（外すと0.443→0.412、ノイズが増える）。
min_treated_presence:
  "100": 0.0
  "500": 0.0
  "2000": 0.1

# --- 所見との対応づけ ---
max_finding_types: 15

# --- 代表patchの可視化 ---
exemplar_k: 100
n_exemplar_clusters: 100  # 候補は最大k個までしかありえないので、事実上「候補は全部出す」の意味
n_exemplars_per_cluster: 36
exemplar_grid_cols: 6
