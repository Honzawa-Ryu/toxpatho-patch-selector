title: 塊内のk-meansコンセンサスによるpatch pattern(コア)抽出
status: 完了
purpose: 0015で背景が近いと判定した試験の塊内で、k-means複数runの共所属から安定なpatchのまとまり(コア)が取れるかを判断する。
method: 0016のMacenko全patch特徴量をL2正規化+PCA64し、k=50/100/200×抽出seed5×初期化seed4=60 runのk-meansの共所属率をkNNグラフに付けてτ=0.8・Leidenでコア抽出。pilot・block3から最大の塊44試験(block6_all)、QC済みA_clean(block6_clean)、slide平均を引いた版(centered)へ拡張。
results:
- 'kを混ぜたコンセンサス(Leiden, τ=0.8): pilot 81コア・覆う割合62%・Control<5%コア25、block3 76コア・60%・15(README.md)'
- 'kごとのコンセンサスでpilotはk50: 49コア/92%/一致度0.87、k100: 80/82%/0.79、k200: 132/64%/0.72。kを混ぜたことが不安定さの主因で、以後kごとに取る方針(README.md, pilot/per_k/per_k_overview_tau0.8.png)'
- Control<5%のコアは所見と対応するが多くは1〜3化合物に偏る(PPARα作動薬の顆粒状好酸性変性など)(README.md)
- 'k=200のコア/Control<5%/全粒度入れ子かつControl<5%: block6_all 140/20/9、block6_clean 133/27/10、block6_clean_centered 122/5/1(README.md)'
- slide平均を引くとコア内最多化合物の割合中央値が0.2前後→0.12〜0.16で化合物をまたぐが、Controlとの分離は弱まる(README.md, DISCUSSION_20261024)
- block6_cleanでもnitrosodiethylamineのControlなどに縦の帯が残る(README.md)
