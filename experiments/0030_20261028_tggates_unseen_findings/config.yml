# 0030: Bayerのラベルで学んだ表現（A〜D、0026 tree_v3/v3s/v3u）を、学習に使っていないTG-GATEsのWSIに当て、所見の分類とプロトタイプの対応を見る。
# 2026-10-28ユーザー: 外部データで試験間差を乗り越えられることは示せた。次はTG-GATEs内で所見を当てられるか。データをやみくもに増やさず、対象の所見に絞る。
# 除くslide: Bayerの230枚（LDAの学習）と脂肪変性の3試験（プロトタイプ作り）。対象の所見がある試験の全slide（対照群を含む）を使う。
