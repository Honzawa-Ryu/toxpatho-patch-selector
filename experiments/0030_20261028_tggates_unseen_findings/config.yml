# 0030: Bayerのラベルで学んだ表現（A〜D、0026 tree_v3/v3s/v3u）を、学習に使っていないTG-GATEsのWSIに当て、所見の分類とプロトタイプの対応を見る。
# 2026-10-28ユーザー: 外部データで試験間差を乗り越えられることは示せた。次はTG-GATEs内で所見を当てられるか。データをやみくもに増やさず、対象の所見に絞る。
# 除くslide: Bayerの230枚（LDAの学習）と脂肪変性の3試験（プロトタイプ作り）。対象の所見がある試験の全slide（対照群を含む）を使う。
seed: 0
exp0021: 0021_20261025_patch_prototypes
exp0025: 0025_20261026_context_mixing_search
exp0026: 0026_20261027_fatty_degeneration_prototypes
exp0027: 0027_20261027_weak_supervision_extrapolation
exp0029: 0029_20261028_external_finding_maps
cache_from: cache_v1
combo_resid_dim: 16
combo_resid_weight: 0.5
lda_exclude_slides: outputs/target_slide_list/bayer_lda_exclude_fat_vacuole.csv
exclude_exps: [66, 67, 698]
qc_catalog: /workspace/andre01/honzawa/02-playground/tggate-wsi-qc/outputs/qc/catalog/slide_quality.csv
pathology_csv: data/corrected/open_tggates_pathology.csv
grade_map: {minimal: 1, slight: 2, moderate: 3, severe: 4, P: 1}
features_dirs:
  - outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko
  - outputs/0016_20261013_tier1_macenko_embeddings/20x_256px_0px_overlap/features_uni_v2_macenko_sub2048
patches_per_slide: 2048
workers: 8
maps:                          # 名前: [0026のrun, 表現, k]。名前の付け方は0029 v5と同じ（prototype_names_*.csv を読む）
  A_sphering_lda: [tree_v3, sphering_lda, 100]
  B_sphering: [tree_v3s, sphering, 100]
  C_lda: [tree_v3u, lda, 100]
  D_unsup: [tree_v3u, unsup, 100]
names_from: v5_names_excl21   # 2026-10-29: 命名から脂肪滴系の21枚のラベルを除いた版（scripts/prototype_names_excl21.py）。v1はv5（含む）だった
findings:                      # 対象の所見（TG-GATEsの FINDING_TYPE）。bayer: 対応するBayerのラベル（ないものは外挿の確認用）
  Necrosis: necrosis
  Single cell necrosis: single_cell_necrosis
  Cellular infiltration: inflammation
  Increased mitosis: mitosis
  Hematopoiesis, extramedullary: emh
  Proliferation, bile duct: ""
  Hypertrophy: ""
  Change, eosinophilic: ""
  Vacuolization, cytoplasmic: ""
  Degeneration, granular, eosinophilic: ""
cv_splits: 5                   # 化合物単位の分割（化合物数が少なければその数）
variants:
  v2:                          # 2026-10-29ユーザー: slide上のプロトタイプの分布（地図）と、各プロトタイプの見た目（未学習slideのpatch）
    maps_tiles:
      n_per_finding: 2         # 所見ごとに記録ありslideを最大2枚（化合物は重複させない。新しい試験を優先、程度の高い順）＋その試験の対照群1枚
      thumb: 1000
      tiles_per_proto: 8
      protos_per_sheet: 25
      colors: {necrosis: "#D55E00", inflammation: "#E69F00", mitosis: "#8E44AD", single_cell_necrosis: "#B8860B", emh: "#56B4E9", central_vein: "#0072B2", portal_tract: "#009E73", large_vessel: "#CC79A7"}
  v3:                          # 2026-10-29ユーザー: 命名を21枚除外版に差し替えて全部やり直し（v1の分類＋v2の地図・見た目）
    resume: true               # 地図の部分で落ちたので、保存した割り当てから再開
    maps_tiles:
      n_per_finding: 2         # 所見ごとに記録ありslideを最大2枚（化合物は重複させない。新しい試験を優先、程度の高い順）＋その試験の対照群1枚
      thumb: 1000
      tiles_per_proto: 8
      protos_per_sheet: 25
      colors: {necrosis: "#D55E00", inflammation: "#E69F00", mitosis: "#8E44AD", single_cell_necrosis: "#B8860B", emh: "#56B4E9", central_vein: "#0072B2", portal_tract: "#009E73", large_vessel: "#CC79A7"}
  v4:                          # 2026-10-29ユーザー: ①に必要最低限。Bayerだけで作った重心（0032）、表現はDとCだけ。名前は0029 v9。間引き特徴を保存して以後の再実行を短くする
    proto_root: outputs/0032_20261029_bayer_only_prototypes/v1
    names_from: v9
    maps:
      D_unsup: [., unsup, 100]
      C_lda: [., lda, 100]
    titles: {D_unsup: "D", C_lda: "C"}
    maps_tiles:
      n_per_finding: 2
      thumb: 1000
      tiles_per_proto: 8
      protos_per_sheet: 25
      colors: {necrosis: "#D55E00", inflammation: "#E69F00", mitosis: "#8E44AD", single_cell_necrosis: "#B8860B", emh: "#56B4E9", central_vein: "#0072B2", portal_tract: "#009E73", large_vessel: "#CC79A7"}
