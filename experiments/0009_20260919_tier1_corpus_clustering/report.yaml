title: tier1コーパス（3,441枚）でのクラスタリング
status: 完了（2026-09-25に監査・再評価あり）
purpose: 0006の候補クラスタ選定をtier1コーパス全体に適用し、所見に対応するパッチ集を作る。
method: k-meansをk=100〜2000で振り、閾値をコーパス規模に合わせて見直し（min_treated_presence=0、min_compounds撤廃、組織割合≥0.85）、保有内率でクラスタを順位付けしてexemplarを出力。
results:
- 0006設定のままでは候補0・LOCO 0.500、原因はmin_treated_presence=0.1で、撤廃後LOCO 0.871（plan.md）
- 候補158個中98.7%が所見と有意に対応、5枚以上ある36所見中35種を捕捉（plan.md）
- 採用k=2000：候補329、保有内率中央値0.682、保有内率0.8以上かつ20枚以上が100個（plan.md）
- 脂肪変性はcholesterolとCCl4で別クラスタ（スライド重なりJaccard 0.00、重心距離0.90）（plan.md, fatty_degeneration_clusters.csv）
- 巣状所見は頭打ち（Single cell necrosis 0.750、Necrosis 0.696）、びまん性所見は最大1.00（plan.md）
- 2026-09-25監査でmanifestにindividual未対応80枚を発見、除外後LOCOは0.8707→0.8587（EXPERIMENT_NOTES.md）
