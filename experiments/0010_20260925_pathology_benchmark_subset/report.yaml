title: 病理所見評価用subsetとラベル監査
status: 完了(subsetは暫定。ROI確認・施設対応表は未着手)
purpose: クラスタリング評価用に交絡を抑えた所見別slide subsetを固定し、既存ラベル・集計の誤りを監査する。
method: tier1 3,441枚で候補3所見の分布を監査し、同一実験・時点のtriplet(陽性/投与陰性/Control)で顆粒状好酸性変性90枚(v1)とNecrosis@Hepatocyte 54枚(v2)を固定。individual非対応80枚と個体重複4枚を除外した3,357枚で既存k=2000候補選定LOCOを再評価し、拡大前後のクラスタ移動を可視化。
results:
- 顆粒状好酸性変性@Hepatocyteでfenofibrate/gemfibrozil/lomustine各10組=90枚(v1)を固定。facility不明・用量・併存所見の交絡が残る暫定subset(README.md)
- individual metadata非対応80枚(CCl4 exp67:20, acetaminophen exp42:21, exp707:39)をunknown扱いに。評価対象は3,357枚(FOLLOWUP.md, label_audit/sensitivity.csv)
- 候補選定LOCOのpooled AUROCは旧条件0.8707(329候補)→unknown・個体重複除外0.8587(330候補)(label_audit/sensitivity.csv, FOLLOWUP.md)
- 同用量ペアは顆粒状好酸性変性で3組しか作れず、代替のNecrosis@Hepatocyte 6化合物×9枚=54枚をv2に固定。陽性18枚中12枚はSP_FLG=True(FOLLOWUP.md, snapshot_v2/)
- 54枚×6ランダムpatch=324patchの一次目視(Codex)では巣状壊死を確認/否定できず全54件uncertain(assistant_screening_v2.csv, FOLLOWUP.md)
- k2000品質表のgrade_passed/best_rhoがk1000からの誤結合だったため除去(FOLLOWUP.md, EXPERIMENT_NOTES.md)
- 旧42/53脂肪変性patchの77.7%はk=2000の4クラスタへ移るが、全コーパスではどれもq<0.05を通らない(scale_visualization_20261009/fatty_candidate_loss.png)
- k=2000で旧コホートと共通に選定114、追加216、消失114クラスタ(scale_trace/scale_trace_summary.png)
