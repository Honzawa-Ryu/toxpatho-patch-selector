title: run横断の投票率による候補patchの層分けと目視
status: 完了(L3層は未実行・不要と判断)
purpose: 0012の多数runをまたいで安定に候補となるpatchを、投票率で層分けして目視し、選定指標を決める。
method: 0012の110 runで各patchが同じ所見の候補クラスタに入った割合(投票率、分母110)を計算し、層・0.1刻み区間ごとの所見別画像シートを作成。q値・一貫性との関係も確認。
results:
- 選定指標は投票率(分母110)のみとし、閾値は所見ごとに決める方針(閾値は未決)(README.md, EXPERIMENT_NOTES.md)
- q値と投票率の順位相関はpatch単位-0.42、slide単位-0.23。投票率はクラスタの大きさとも+0.44で相関しq値は選定に使わない(q_vote/q_vote_correlation.csv, README.md)
- 一貫性(最多所見回数/候補回数)は切り分けが弱く不採用(README.md)
- 投票率≥0.05のpatchはHypertrophy 61,855、顆粒状好酸性変性50,374、脂肪変性12,358など17所見。顆粒状好酸性変性・脂肪変性は投票率0.9以上に集中、Hypertrophyは広く分布(vote_fraction_by_finding_counts.png)
- 110 runは手法混在(MiniBatch 48, Lloyd 36, Leiden 15, Ward 6, コンセンサス 5)で同一条件の再現率ではない(README.md)
