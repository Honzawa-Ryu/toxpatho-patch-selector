title: 外部slideの所見・構造マップ(A〜D比較)
status: 完了(v1〜v9、v6/v7の目視評価結果は未集計)
purpose: 仮説①(ラベルを学んだ所見・構造はラベルのないslideからも取り出せる)を、外部slide上のプロトタイプ地図で確かめる。
method: 外部47枚(壊死30・対照12・炎症のみ5)にA(Sphering+LDA)/B(Sphering)/C(LDA)/D(unsup)のプロトタイプを色分けし、v2拡大窓、v3試験効果・壊死タイル、v4対照群のドメイン差、v5で2×2比較、v6/v7盲検評価窓、v8命名から脂肪系21枚除外、v9でBayerのみ重心(0032)のC/D/D13。
results:
- 'v8 壊死slide vs 対照のAUC: A 0.86、B 0.98、C 0.93、D 0.92。炎症: A 0.91、B 0.89、C 0.55、D 0.50(v8/slide_auc.csv)'
- 'v8 対照群kNNの他ドメイン割合(TG起点、混ざれば0.47): A 0.33、B 0.36、C 0.43、D 0.25(v8/domain_gap.csv)'
- 'v8 会社特異プロトタイプ数: D 20個、A 5、B 4、C 1(v8/study_effect.csv)'
- 'v9(Bayerのみ重心) 壊死AUC: C 0.975、D13 0.795、D 0.708。色付け面積と壊死程度のrho: C 0.75 [0.64,0.82]、D 0.42、D13 0.41(v9/slide_auc.csv, v9/severity/severity_spearman.csv)'
- v6/v7は盲検評価用の窓画像とrating_key.csvを作成(評価結果の集計ファイルは見当たらない)(v7/rating/)
