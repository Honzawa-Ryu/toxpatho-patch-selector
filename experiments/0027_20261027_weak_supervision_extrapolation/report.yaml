title: 弱教師・Control正規化の外挿性比較
status: 完了（v2はcompletion.jsonがrunningのままだがresults.csv・図あり）
purpose: 学習に使わない所見ラベル(外挿)まで分けられる弱教師あり・バッチ除去手法を比較する。
method: Bayerラベルの一部(A:壊死・濃い肝細胞・炎症、B:中心静脈・門脈域・核分裂像)を伏せ、unsup/LDA/unsup+LDA/Sphering/Sphering+LDA/TVN/TVN+LDA/GCD/敵対AEを比較。v1は分割ごとモデル(不適切)、v2は単一モデル、v3は脂肪変性で外挿確認、v4はControl追加後に全試験でv2を再実行。
results:
- 'v4(229枚・67試験・約324万patch): 伏せたAの純度k100 sphering_lda0.466、sphering0.442、unsup0.417、lda0.219、ae_adv0.144（v4/results.csv, v4/results.json）'
- 伏せたBの純度k100 sphering_lda0.312が最良、gcd0.147。gcdは既知ラベル純度0.45〜0.48と高いが外挿できない（v4/results.csv）
- 混ざり具合(別試験近傍) lda0.89・ae_adv0.94と高いが区別を失う、sphering0.51（v4/results.csv）
- 'v3脂肪変性: cholesterolの純度≥0.9プロトタイプ unsup5・sphering5・lda0（v3/results.csv）'
