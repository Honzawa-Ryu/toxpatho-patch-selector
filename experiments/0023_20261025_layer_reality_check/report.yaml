title: 層別化の現実との突き合わせ
status: 完了（external_v1のcompletion.jsonはrunningのまま、v3で再実行済み）
purpose: 形態・小葉位置・領域の層が実際の組織と所見記録に結びつくかを、リークを断ってTG-GATEsと外部で確かめる。
method: ラベルなし表現+周辺平均から小葉位置を試験ごと5分割で回帰(lobular_v1)、TG-GATEsで学習した層を外部78枚にそのまま適用(external_v1-v3、v3はNaN修正後)、形態・小葉・領域の3層を記録と比較(three_layers_v1)。
results:
- 小葉位置の回帰は学習外試験でR²0.25・順位相関0.45、病変の予測位置は記録分布と7件中6件一致(allyl alcohol壊死のみ不一致0.33)（README.md, lobular_v1/results.json）
- 外部で壊死プロトタイプ割合は対照0.1〜1.4%、thioacetamide 4〜11%、acetaminophen 7〜18%、ブロモベンゼン7〜15%（README.md, external_v1/external_layers.csv）
- '3層: 壊死プロトタイプ割合と記録の壊死程度の順位相関 TG-GATEs0.68/外部0.70、領域層は−0.16で結びつかない（README.md, L1_three_layers_vs_records.png）'
