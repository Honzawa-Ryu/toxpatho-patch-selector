title: 大規模版でのクラスタリング手法・粒度・seed比較
status: 完了
purpose: 候補選定を固定し、クラスタリング手法・k・seed・部分集合の違いで候補クラスタがどれだけ再現するかを調べる。
method: 0009のPCA64キャッシュ(3,441枚)上でMiniBatch/Lloyd/Leiden/Ward/コンセンサスをk=250〜10000、seed・部分集合を変えて計111割当を作り、方式Aで候補選定してARI・Jaccard・保有内率・LOCOを比較。
results:
- k=2000で個々の候補クラスタの最良対応Jaccard中央値は0.25〜0.33、ARI 0.26〜0.31。候補patch集合全体のJaccardは約0.72(README.md, summary/stability_pairs.csv)
- 約3000クラスタでLeiden r=256はARI 0.49・Jaccard 0.50、k-means k=3000は0.25〜0.29/0.23〜0.29。タスク指標は同程度(保有内率0.73〜0.75、LOCO 0.83〜0.84)(README.md)
- 保有内率中央値はk=250で0.55、2000で0.70、10000で0.85〜0.89と単調増加するが、90%以上単一化合物のクラスタも約40→650〜900に急増。LOCOはk≥1000で0.84〜0.86で頭打ち(README.md)
- 旧cholesterol脂肪変性patch(旧42/53)はどの設定でも候補にほぼ残らない(0〜0.2%)(README.md)
- 採用中0009 k=2000のLOCO 0.859はseed違い5runの平均0.843より高い側(README.md)
