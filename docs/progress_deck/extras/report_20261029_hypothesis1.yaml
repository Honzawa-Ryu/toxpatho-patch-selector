id: report_20261029_hypothesis1
date: '2026-10-29'
title: 仮説①検証レポート（0032/0031 v2/0030 v4/0029 v9）
status: 完了（報告済み）
purpose: Bayerラベルで学んだ表現のプロトタイプが、未学習の化合物・slide・施設で所見・構造を取り出せるかを検証する。
method: C(LDA13次元)・D(PCA64)・D13(PCA13)の3表現でBayer230枚のみからk=100コンセンサスk-meansプロトタイプを作り、patch単位(化合物held-out)、slide単位(未学習TG-GATEs 3,319枚)、外部(塩野義・エーザイ78枚)で比較、化合物bootstrap 2,000回の95%区間。
results:
- 'patch単位平均F1: C−D +0.18[0.14,0.20]、C−D13 +0.22[0.18,0.24]、壊死F1 C0.74/D0.57、核分裂像0.71/0.33（index.html, 0031 v2）'
- '未学習TG-GATEs学習なしAUC平均: C−D +0.22[0.13,0.29]、核分裂像C0.93 vs D0.30、壊死・単細胞壊死はC≒D（index.html, 0030 v4）'
- '外部: 会社偏りプロトタイプD28個→C4個、TG-GATEs近傍の外部割合25%→43%、壊死程度相関C0.75 vs D0.42（index.html, 0029 v9）'
- Bayerにない所見への外挿ではC≒D、仮説①の範囲外（index.html §7）
